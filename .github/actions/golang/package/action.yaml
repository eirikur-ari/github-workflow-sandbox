name: Package
description: Packages the binary into an archive

inputs:
  upload-artifact:
    description: Upload the archive
    default: 'false'
  project-path:
    description: Path to the project to package
    default: ''
  artifact-path:
    description: Path to the artifact to upload
    default: 'build/dist/*.tar.gz'
  artifact-name:
    description: Name of the uploaded artifact
    required: true

runs:
  using: composite
  steps:
    - name: Package
      shell: bash
      run: make -C ${{ inputs.project-path }} package

    - name: Upload Archive
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.project-path == '' && inputs.artifact-path || format('{0}/{1}', inputs.project-path, inputs.artifact-path) }}
        if-no-files-found: error
        # An approval of the release can wait up to 30 days
        retention-days: 30
