name: Package
description: Packages the binary into an archive

inputs:
  upload:
    description: Upload the archive
    default: 'false'
  artifact-name:
    description: Name of the uploaded artifact
    required: true

runs:
  using: composite
  steps:
    - name: Package ${{ inputs.artifact-name }}
      shell: bash
      run: make package

    - name: Upload Archive
      if: ${{ inputs.upload == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: build/dist/*.tar.gz
        if-no-files-found: error
        # An approval of the release can wait up to 30 days
        retention-days: 30
