name: Scratchpad
description: Scratchpad for testing GitHub Actions workflows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scratchpad:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smu
        run: echo "Smu!!!!!" >> $GITHUB_STEP_SUMMARY

      - name: Show how the group expression evaluates
        run: |
          echo "without inner parens: ${{ github.ref_name == github.event.repository.default_branch && github.sha }}"
          echo "with inner parens:    ${{ (github.ref_name == github.event.repository.default_branch) && github.sha }}"
          echo "&& evaluated first:   ${{ github.ref_name == (github.event.repository.default_branch && github.sha) }}"