name: Dummy Go Build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - '.github/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Dummy Build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PROJECT_PATH: samples/golang/dummy
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.PROJECT_PATH }}/go.mod
          cache-dependency-path: ${{ env.PROJECT_PATH }}/go.mod

      - name: Test
        run: make -C ${{ env.PROJECT_PATH }} test

      - name: Build
        run: make -C ${{ env.PROJECT_PATH }} build

      - name: Acceptance Test
        if: ${{ github.event_name == 'pull_request' }}
        run: make test-acceptance

      - name: Package
        if: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/golang/package
        with:
          artifact-name: dist-${{ matrix.os }}
          project-path: ${{ env.PROJECT_PATH }}
