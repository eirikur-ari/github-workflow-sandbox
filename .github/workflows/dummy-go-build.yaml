name: Dummy Go Build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - '.github/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    env:
      PROJECT_PATH: samples/golang/dummy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
         go-version-file: ${{ env.PROJECT_PATH }}/go.mod
         cache-dependency-path: ${{ env.PROJECT_PATH }}/go.mod

      - name: Vet
        run: make -C ${{ env.PROJECT_PATH }} vet

      - name: Lint
        run: make -C ${{ env.PROJECT_PATH }} lint
            
  test:
    name: Dummy Test
    needs: static-analysis
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] #, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PROJECT_PATH: samples/golang/dummy
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: make -C ${{ env.PROJECT_PATH }} test
  
  build:
    name: Dummy Build
    needs: [static-analysis, test]
    runs-on: ubuntu-latest
    env:
      PROJECT_PATH: samples/golang/dummy
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.PROJECT_PATH }}/go.mod
          cache-dependency-path: ${{ env.PROJECT_PATH }}/go.mod

      - name: Build
        run: make -C ${{ env.PROJECT_PATH }} build

      - name: Package
        uses: ./.github/actions/golang/package
        with:
          artifact-name: dist-${{ matrix.os }}
          project-path: ${{ env.PROJECT_PATH }}
