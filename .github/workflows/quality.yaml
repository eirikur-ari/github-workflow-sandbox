name: Quality Checks

on:
  pull_request:
  push:
  workflow_dispatch:

env:
  PROJECT_PATH: samples/golang/dummy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.PROJECT_PATH }}/go.mod
          cache-dependency-path: ${{ env.PROJECT_PATH }}/go.mod

      - name: Test with Coverage
        run: make -C ${{ env.PROJECT_PATH }} coverage

      - name: Coverage Summary
        run: |
          coverage=$(make --silent -C ${{ env.PROJECT_PATH }} coverage-summary)
          echo "### Coverage: $coverage" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage.out
          path: ${{ env.PROJECT_PATH }}/build

  codecov:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Coverage Report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage.out
          path: ${{ env.PROJECT_PATH }}/build

      - name: Upload Report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ${{ env.PROJECT_PATH }}/build/coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          override_branch: ${{ github.ref_name }}
          verbose: true
          fail_ci_if_error: true

  sonar:
    if: (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch)
    needs: test
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download Coverage Report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage.out
          path: ${{ env.PROJECT_PATH }}/build

      - name: Cache Sonar packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Sonar Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG_NAME }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_GOLANG_DUMMY }}
            -Dsonar.go.coverage.reportPaths=build/coverage.out
            -Dsonar.exclusions=docs/**
            -Dsonar.coverage.exclusions=**/*_test.go,internal/testutil/**
            -Dsonar.qualitygate.wait=false
          projectBaseDir: ${{ env.PROJECT_PATH }}

  quality:
    if: always()
    needs: [test, codecov, sonar]
    runs-on: ubuntu-latest
    steps:
      - name: Report the result of each job
        env:
          TEST: ${{ needs.test.result }}
          CODECOV: ${{ needs.codecov.result }}
          SONAR: ${{ needs.sonar.result }}
        run: |
          {
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| test | $TEST |"
            echo "| codecov | $CODECOV |"
            echo "| sonar | $SONAR |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fail if a job failed or no tests ran
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || needs.test.result == 'skipped'
        run: exit 1
