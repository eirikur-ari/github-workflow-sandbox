name: Dummy Go Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 1.2.3
        required: false
        type: string

permissions:
  contents: read

env:
  PROJECT_PATH: samples/golang/dummy

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
         go-version-file: ${{ env.PROJECT_PATH }}/go.mod
         cache-dependency-path: ${{ env.PROJECT_PATH }}/go.mod

      - name: Vet
        run: make -C ${{ env.PROJECT_PATH }} vet

      - name: Lint
        run: make -C ${{ env.PROJECT_PATH }} lint

  build:
    name: Build and Release
    needs: static-analysis
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.PROJECT_PATH }}/go.mod
          cache-dependency-path: ${{ env.PROJECT_PATH }}/go.mod

      - name: Test
        run: make -C ${{ env.PROJECT_PATH }} test

      - name: Build
        run: make -C ${{ env.PROJECT_PATH }} build-all
    
      - name: Package
        uses: ./.github/actions/golang/package
        with:
          artifact-name: dist
          upload-artifact: 'true'
          project-path: ${{ env.PROJECT_PATH }}

      - name: Package
        run: make -C ${{ env.PROJECT_PATH }} package

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ env.PROJECT_PATH }}/build/dist

  acceptance:
    name: Dummy Acceptance ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] #, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.PROJECT_PATH }}/go.mod

      - name: Download Archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ env.PROJECT_PATH }}/build/dist

      - name: Extract Archive
        run: bash ${{ env.PROJECT_PATH }}/scripts/acceptance-test.sh extract

      - name: Acceptance Test
        run: make -C ${{ env.PROJECT_PATH }} test-acceptance
        env:
          DUMMY_BINARY: ${{ github.workspace }}/${{ env.PROJECT_PATH }}/build/acceptance/dummy
