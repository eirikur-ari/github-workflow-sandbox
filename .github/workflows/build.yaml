name: Build

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - master
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the default branch
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "code=true"
          else
            ./scripts/changes.sh '*.md' .gitignore LICENSE
          fi >> "$GITHUB_OUTPUT"
          
  static-analysis:
    name: Static analysis
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
         go-version-file: go.mod
         cache-dependency-path: go.sum

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint
            
  test:
    name: Test
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] #, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: make test
  
  build:
    name: Build & Package
    needs: [static-analysis, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: make build-all

      - name: Package
        run: make package

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: build/dist
          retention-days: 7

  build-ok:
    # The required check. Passes when everything passed or was skipped because
    # only docs changed; fails on any failure or cancellation.
    name: Build OK
    needs: [changes, static-analysis, test, build]
    if: ${{ always() }}
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Report the result of each job
        run: |
          {
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| changes | ${{ needs.changes.result }} (code changed: ${{ needs.changes.outputs.code }}) |"
            echo "| static-analysis | ${{ needs.static-analysis.result }} |"
            echo "| test | ${{ needs.test.result }} |"
            echo "| build | ${{ needs.build.result }} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fail if a job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
